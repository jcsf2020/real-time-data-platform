version: 2

models:
  - name: gold_market_event_daily_aggregates
    description: >
      Per-symbol per-day price summary (OHLCV-style) over bronze.market_events.
      Reproduces the logic of gold.refresh_market_event_daily_aggregates() defined
      in infra/postgres/init.sql. Reads bronze directly (not via the silver model)
      to preserve price extremes at raw event granularity. Materialized as a table;
      the stored function remains authoritative until dbt CI is established (see
      docs/dbt-transformation-governance-plan.md section 10).
    config:
      schema: gold
      materialized: table
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - symbol
              - event_date
    columns:
      - name: symbol
        description: "Trading symbol (e.g. AAPL, GOOGL)."
        tests:
          - not_null
      - name: event_date
        description: "Calendar date of the aggregated events (event_timestamp::date)."
        tests:
          - not_null
      - name: event_count
        description: "Number of trade events on this date for this symbol."
        tests:
          - not_null
      - name: avg_price
        description: "Average trade price for the day. NUMERIC(18,8)."
        tests:
          - not_null
      - name: min_price
        description: "Minimum trade price for the day. NUMERIC(18,8)."
        tests:
          - not_null
      - name: max_price
        description: "Maximum trade price for the day. NUMERIC(18,8)."
        tests:
          - not_null
      - name: total_quantity
        description: "Total quantity traded on this date. NUMERIC(18,8)."
      - name: first_event_timestamp
        description: "Earliest event_timestamp on this date for this symbol."
      - name: last_event_timestamp
        description: "Latest event_timestamp on this date for this symbol."
      - name: updated_at
        description: "Timestamp when dbt last materialized this row (NOW() at run time)."
