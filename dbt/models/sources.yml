version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      Raw validated market events written by the Python consumer via
      ON CONFLICT(event_id) DO NOTHING. This table is append-only and is NOT
      managed by dbt — dbt only reads from it as a source.
    tables:
      - name: market_events
        description: >
          Bronze table. One row per unique market event. Written at ingest time
          by the rtdp-consumer (local) or rtdp-pubsub-worker (GCP).
        columns:
          - name: event_id
            description: "Idempotency key — UUID generated by the producer."
            tests:
              - not_null
              - unique
          - name: symbol
            description: "Trading symbol (e.g. AAPL, GOOGL)."
            tests:
              - not_null
          - name: event_type
            description: "Market event type. Derived from the MarketEvent contract (Literal['trade'])."
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['trade']
          - name: price
            description: "Trade price. Positive NUMERIC(18,8)."
            tests:
              - not_null
          - name: quantity
            description: "Trade quantity. Positive NUMERIC(18,8)."
            tests:
              - not_null
          - name: event_timestamp
            description: "When the market event occurred (TIMESTAMPTZ)."
            tests:
              - not_null
          - name: ingested_at
            description: "When the consumer persisted this row (server default NOW())."
          - name: source_topic
            description: "Kafka/Redpanda topic from which the event was consumed."
          - name: raw_payload
            description: "Original JSONB message payload — preserved for replay or audit."
