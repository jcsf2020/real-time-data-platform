name: BigQuery Quality Checks

"on":
  workflow_dispatch:
    inputs:
      min_row_count:
        description: "Minimum row count threshold. Use 999999999 for controlled failure proof."
        required: false
        default: "1"
      freshness_max_age_hours:
        description: "Max data age in hours. Use 0 to skip."
        required: false
        default: "0"
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  bigquery-quality-checks:
    name: Run BigQuery quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BigQuery quality checks
        run: |
          python3 scripts/run_bigquery_quality_checks.py \
            --min-row-count ${{ inputs.min_row_count || '1' }} \
            --freshness-max-age-hours ${{ inputs.freshness_max_age_hours || '0' }} \
            --report-output docs/evidence/bigquery-quality-checks/ci-report.json

      - name: Upload quality check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigquery-quality-checks-report
          path: docs/evidence/bigquery-quality-checks/ci-report.json
