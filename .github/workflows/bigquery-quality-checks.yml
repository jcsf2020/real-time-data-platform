name: BigQuery Quality Checks

"on":
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  bigquery-quality-checks:
    name: Run BigQuery quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BigQuery quality checks
        run: |
          python3 scripts/run_bigquery_quality_checks.py \
            --report-output docs/evidence/bigquery-quality-checks/ci-report.json

      - name: Upload quality check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigquery-quality-checks-report
          path: docs/evidence/bigquery-quality-checks/ci-report.json
