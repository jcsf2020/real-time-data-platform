name: Build dbt Refresh Job Image

# Terraform owns google_cloud_run_v2_job.rtdp_dbt_refresh_job.
# This workflow only builds and pushes the container image to Artifact Registry.
# No Cloud Run Job is created, updated, or executed here.
# Cloud Run Job deployment/execution must be handled in a controlled Terraform
# apply and evidence branch after Terraform resource ownership is accepted.

"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-dbt-refresh-job-image:
    name: Build and push dbt refresh job image
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: project-42987e01-2123-446b-ac7
      REGION: europe-west1
      ARTIFACT_REGISTRY_HOST: europe-west1-docker.pkg.dev
      ARTIFACT_REGISTRY_REPOSITORY: rtdp
      IMAGE_NAME: rtdp-dbt-refresh-job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CLOUD_RUN_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${ARTIFACT_REGISTRY_HOST}" --quiet

      - name: Build dbt refresh job image
        run: |
          IMAGE_URI="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          docker build \
            --file apps/dbt-refresh-job/Dockerfile \
            --tag "${IMAGE_URI}" \
            .

      - name: Push dbt refresh job image
        run: docker push "${IMAGE_URI}"

      - name: Tag image as latest in Artifact Registry
        run: |
          LATEST_URI="${ARTIFACT_REGISTRY_HOST}/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:latest"
          echo "LATEST_URI=${LATEST_URI}" >> "${GITHUB_ENV}"
          docker tag "${IMAGE_URI}" "${LATEST_URI}"
          docker push "${LATEST_URI}"

      - name: Report image build result
        # No Cloud Run mutation occurs in this workflow.
        # Terraform owns google_cloud_run_v2_job.rtdp_dbt_refresh_job.
        # Cloud Run Job apply/deploy/execution must be handled in a dedicated
        # controlled Terraform evidence branch.
        run: |
          echo "IMAGE_URI=${IMAGE_URI}"
          echo "LATEST_URI=${LATEST_URI}"
          echo "IMAGE_PUSHED=true"
          echo "CLOUD_RUN_JOB_NOT_DEPLOYED_BY_THIS_WORKFLOW=true"
